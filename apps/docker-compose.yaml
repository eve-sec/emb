version: '3.7'

services:

  store:
    image: x07/emb-backend:latest
    restart: always
    ports:
      - "7562:7562"
    volumes:
      - ./esi-cache:/esi-cache
      - ./data.db:/root/data.db
    environment:
      - "ESI_CACHE=/esi-cache"

  website:
    image: x07/emb-frontend:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./website/public/icons:/app/public/icons
      - ./esi-cache:/esi-cache
    environment:
      - "ESI_CACHE=/esi-cache"
      - "API_HOST=10.100.0.248"
      - "API_PORT=7562"

  static-store:
    image: x07/emb-static-store:latest
    restart: no
    volumes:
      - ./esi-cache:/esi-cache
    environment:
      - "ESI_CACHE=/esi-cache"


  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    restart: no
    ports:
      - "8428:8428"
    volumes:
      - ./victoriametrics/prometheus.yml:/etc/prometheus.yml
      - ./victoriametrics/data:/victoria-metrics-data
    command:
      - '--promscrape.config=/etc/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/main-dashboard.json:/var/lib/grafana/dashboards/main-dashboard.json
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped
    logging:
      driver: none
    user: "472"
